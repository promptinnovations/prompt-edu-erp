# PROMPT EDU ERP — CI (ARCHITECTURE.md §AB "CI gates", §X.1 "a build-time
# check fails CI if a secret-looking env var is referenced from client
# code"). Runs entirely against the local embedded database (PGlite) —
# no external Supabase project or secrets needed for this pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Secret-leak check (§X.1)
        run: npm run check:secrets

      - name: Dependency audit (npm audit)
        # Advisory, not a hard gate: as of this writing every available fix
        # for the current production-dependency findings (postcss/sharp via
        # next, next-intl, exceljs's uuid) requires `npm audit fix --force`
        # -- a breaking major-version bump (Next.js 15->16 is the big one)
        # that needs its own deliberate upgrade-and-reverify pass, not
        # something CI should silently force or block every PR on. This
        # step still runs on every push/PR and fails visibly loud in the
        # Actions log/summary so findings are never silently missed --
        # continue-on-error just stops it from blocking merges on pre-
        # existing, already-tracked findings. See docs/SECURITY.md's
        # "Known gaps" for the up-to-date list and docs/SETUP.md for the
        # tracked follow-up.
        run: npm run check:audit
        continue-on-error: true

      - name: Tests (tenant isolation + every module flow, §AB)
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: e2e (real browser against a disposable PGlite DB — docs/SETUP.md)
        # Advisory until the first real run (this repo's dev sandbox couldn't
        # reach cdn.playwright.dev to download a browser binary, so this
        # suite is code-complete but unverified as of this commit — see
        # docs/SETUP.md's "Browser/e2e testing" entry). Flip off once a real
        # run here has confirmed it passes.
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
